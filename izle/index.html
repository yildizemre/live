<!doctype html>
<html lang="tr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Rejivio İzle</title>
<link rel="icon" href="/brand/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07061a;--card:#110f2c;--raised:#1a1740;--text:#f3f1ff;--muted:#9a96c0;--live:#ff4d6d;--grad:linear-gradient(120deg,#9b3dff,#e63ce0 55%,#ff6a6a)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#000;color:var(--text);font:500 14px 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
video{width:100%;height:100%;object-fit:contain;background:#000}
.top{position:fixed;top:0;left:0;right:0;padding:max(14px,env(safe-area-inset-top)) 16px 30px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(#000c,#0000)}
.av{width:38px;height:38px;border-radius:50%;background:var(--raised);overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.meta{flex:1;min-width:0} .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .meta span{color:var(--muted);font-size:12px}
.pill{padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;background:var(--live);flex:none}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:30px 16px max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;
  background:linear-gradient(#0000,#000c)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:#ffffff1f;color:#fff;cursor:pointer;font:inherit;font-weight:700;text-decoration:none;backdrop-filter:blur(8px)}
.btn.pri{background:var(--grad)}
.unmute{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:16px;padding:14px 22px}
.msg{max-width:340px;text-align:center;padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.msg h1{font-size:22px} .msg p{color:var(--muted)}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="msg"><p>Yükleniyor…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script type="module">
// Uygulama içinden / tarayıcıdan canlı izleme: yayın egress'inin HLS çıkışını oynatır (giriş gerekmez)
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const sb = createClient('https://rrcknioeasynsbsmmnwr.supabase.co', 'sb_publishable_yXoivKQXRJM1CACo9RUThw_nO61Pkek');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stage = document.getElementById('stage');
const code = (new URLSearchParams(location.search).get('kod') || location.pathname.split('/').filter(Boolean)[1] || '').toUpperCase();
let hls, playing = '';

function waiting(info) {
  playing = '';
  hls?.destroy(); hls = null;
  stage.innerHTML = `<div class="msg">${info ? `<h1>${esc(info.title)}</h1><p>@${esc(info.host)} henüz canlı değil. Yayın başlayınca burada otomatik açılır.</p>`
    : '<h1>Yayın bulunamadı</h1><p>Kod hatalı ya da yayın bitmiş.</p>'}
    ${code ? `<a class="btn pri" href="/k/${esc(code)}">Kameranla katıl</a>` : ''}</div>`;
}

function play(info) {
  if (playing === info.hls) return;
  playing = info.hls;
  stage.innerHTML = `<video id="v" playsinline autoplay muted></video>
    <div class="top"><span class="av">${info.avatar ? `<img src="${esc(info.avatar)}" alt="">` : esc((info.host || '?')[0].toUpperCase())}</span>
      <div class="meta"><b>${esc(info.title)}</b><span>@${esc(info.host)}</span></div><span class="pill">CANLI</span></div>
    <button class="btn unmute" id="um">🔊 Sesi aç</button>
    <div class="bottom"><button class="btn" id="sh">Paylaş</button><a class="btn pri" href="/k/${esc(code)}">Kameranla katıl</a></div>`;
  const v = document.getElementById('v');
  // Tarayıcılar sessiz otomatik oynatmaya izin verir; ses için bir dokunuş gerekir
  document.getElementById('um').onclick = () => { v.muted = false; v.play(); document.getElementById('um').remove(); };
  document.getElementById('sh').onclick = () => navigator.share ? navigator.share({ title: info.title, url: location.href }).catch(() => {}) : navigator.clipboard.writeText(location.href);
  if (v.canPlayType('application/vnd.apple.mpegurl')) { v.src = info.hls; }
  else if (window.Hls?.isSupported()) {
    hls = new Hls({ liveSyncDurationCount: 3, manifestLoadingMaxRetry: 10, levelLoadingMaxRetry: 10 });
    hls.loadSource(info.hls); hls.attachMedia(v);
    // Yayın yeni başladıysa ilk parçalar birkaç saniye gecikir: oynatıcı kendini toparlar
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) setTimeout(() => { playing = ''; check(); }, 4000); });
  } else { stage.innerHTML = '<div class="msg"><p>Bu tarayıcı canlı yayını oynatamıyor.</p></div>'; }
}

async function check() {
  if (!code) return waiting(null);
  const { data } = await sb.rpc('public_stream', { code });
  if (!data) return waiting(null);
  document.title = `${data.title} · Rejivio`;
  data.live && data.hls ? play(data) : waiting(data);
}
check();
setInterval(check, 10000);
</script>
</body>
</html>
